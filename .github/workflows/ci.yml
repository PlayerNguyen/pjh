name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test & memory
    runs-on: ubuntu-latest
    env:
      # Guard the production build against bloat.
      PJH_MEMORY_LIMIT_MB: 200
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run check

      - name: Unit tests
        run: bun run test

      - name: Build production bundle
        run: bun run build

      - name: Assert peak RSS below 200MB
        run: bun run test:memory --limit-mb "$PJH_MEMORY_LIMIT_MB" --duration-ms 6000
